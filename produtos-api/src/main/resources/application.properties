spring.application.name=produtos-api
spring.datasource.url=jdbc:postgresql://localhost:5432/produtos_db
spring.datasource.username=postgres

# Em produção, NUNCA deixe a senha do banco versionada em texto puro: configure a
# variável de ambiente DB_PASSWORD. O valor após ":" e usado apenas como padrão
# para facilitar a execução local/didática (mesma senha ja usada neste projeto).
spring.datasource.password=${DB_PASSWORD:aluno}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave usada para assinar e validar os tokens JWT. Em produção, configure a
# variável de ambiente JWT_SECRET com uma chave forte, mantida em segredo e fora
# do código-fonte. O valor apos ":" e um default apenas para uso local/didático.
jwt.secret=${JWT_SECRET:ZmlyamFuLXNlbmFpLXByb2dyYW1hZG9yLWJhY2tlbmQtand0LXNlY3JldA==}
