<!--
    Tela principal do frontend (pós-login): formulários de cadastro de
    categoria e produto, além das listas de categorias e produtos já
    cadastrados. Toda a lógica de chamadas à API fica em js/scriptCadastro.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | API de Produtos</title>

    <link rel="stylesheet" href="css/styleCadastro.css">
</head>

<body>

    <main class="container">

        <header class="topo">
            <div>
                <h1>API de Produtos</h1>
                <p>Cadastro de categorias e produtos</p>
            </div>

            <button type="button" id="btnSair" class="botao-secundario">
                Sair
            </button>
        </header>

        <section class="card">

            <h2>Cadastro de Categoria</h2>

            <form id="formCategoria">

                <div class="campo">
                    <label for="nomeCategoria">Nome</label>
                    <input
                        type="text"
                        id="nomeCategoria"
                        name="nome"
                        placeholder="Digite o nome da categoria"
                        required
                    >
                </div>

                <button type="submit">Cadastrar Categoria</button>

            </form>

            <p id="mensagemCategoria"></p>

            <div class="lista-categorias">
                <h3>Categorias cadastradas</h3>
                <ul id="listaCategorias">
                    <li>Carregando categorias...</li>
                </ul>
            </div>

        </section>

        <section class="card">

            <h2>Cadastro de Produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="nomeProduto">Nome</label>
                    <input
                        type="text"
                        id="nomeProduto"
                        name="nome"
                        placeholder="Digite o nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricaoProduto">Descrição</label>
                    <textarea
                        id="descricaoProduto"
                        name="descricao"
                        placeholder="Digite a descrição do produto"
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="precoProduto">Preço</label>
                    <input
                        type="number"
                        id="precoProduto"
                        name="preco"
                        step="0.01"
                        min="0.01"
                        placeholder="Ex.: 6999.90"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="categoriaProduto">Categoria</label>
                    <select id="categoriaProduto" name="categoria" required>
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>

                <button type="submit">Cadastrar Produto</button>

            </form>

            <p id="mensagemProduto"></p>

        </section>

        <section class="card">

            <h2>Produtos cadastrados</h2>

            <div id="listaProdutos">
                <p>Carregando produtos...</p>
            </div>

        </section>

    </main>

    <script src="js/scriptCadastro.js"></script>

</body>

</html>
